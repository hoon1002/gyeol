<style>
:root{color-scheme:dark;
 --bg-0:#0B0C0E;--bg-1:#111316;--surface:#1C1F24;--surface-2:#23272D;--border:#2A2E35;--border-strong:#3A3F47;
 --text-1:#F3F1EC;--text-2:#B4B6BC;--text-3:#8A8D95;--accent:#FF5B2E;--accent-hover:#FF7A55;--on-accent:#0B0C0E;
 --s-phys:#5CB8FF;--s-math:#8F9BFF;--s-chem:#3ED6C0;--s-econ:#F5C451;--s-eng:#C29BFF;
 --grain-minor:rgba(243,241,236,.10);--grain-major:rgba(243,241,236,.24);--glass:rgba(17,19,22,.66);
 --shadow-3:0 30px 80px -20px rgba(0,0,0,.75),0 12px 24px -12px rgba(0,0,0,.55);
 --f-kr:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif;--f-d:"Hahmlet","Noto Serif KR",serif;--f-en:"Fraunces",Georgia,serif;--f-mono:"JetBrains Mono",ui-monospace,monospace;
 --gutter:clamp(16px,4vw,56px);--ease-out:cubic-bezier(.22,1,.36,1);--ease-in:cubic-bezier(.55,0,1,.45);
 --spring:linear(0,.009,.035 2.1%,.141,.281 6.7%,.723 12.9%,.938 16.7%,1.017,1.077,1.121,1.149 24.3%,1.159,1.163,1.161,1.154 29.9%,1.129 32.8%,1.051 39.6%,1.017 43.1%,.991,.977 51%,.974 53.8%,.975 57.1%,.997 69.8%,1.003 76.9%,1.004 83.8%,1)}
:root[data-theme="light"]{color-scheme:light;
 --bg-0:#F6F4EF;--bg-1:#EFECE6;--surface:#FFFFFF;--surface-2:#F3F0EA;--border:#DCD7CD;--border-strong:#C7C1B5;
 --text-1:#15161A;--text-2:#474A52;--text-3:#5C5F67;--accent:#C23A10;--accent-hover:#A93210;--on-accent:#FFFFFF;
 --s-phys:#1167B8;--s-math:#4B55D6;--s-chem:#0A7C6E;--s-econ:#8A6200;--s-eng:#7A43D1;
 --grain-minor:rgba(21,22,26,.085);--grain-major:rgba(21,22,26,.2);--glass:rgba(246,244,239,.72);
 --shadow-3:0 30px 80px -24px rgba(30,25,15,.28),0 12px 24px -12px rgba(30,25,15,.12)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:0s!important;animation-duration:1ms!important}}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg-0)}
body{margin:0;min-height:100vh;background:transparent;color:var(--text-1);font-family:var(--f-kr);font-size:16px;line-height:1.7;letter-spacing:-.01em;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased;overflow-x:clip}
h1,h2,p,ul,ol{margin:0}ul,ol{padding:0;list-style:none}
button,select{font:inherit;color:inherit;letter-spacing:inherit}button{background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus{outline:none}:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
svg{flex-shrink:0}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
#field{position:fixed;inset:0;z-index:-1;width:100%;height:100%;display:block}
.mono{font-family:var(--f-mono);letter-spacing:0}
/* 상단 바 */
.top{position:fixed;inset:0 0 auto;z-index:40;display:flex;align-items:center;gap:10px;height:56px;padding:0 var(--gutter);transition:transform .32s var(--ease-out),opacity .32s}
.top.hide{transform:translateY(-100%);opacity:0}
.top .here{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
.top .here svg{width:26px;height:26px}
.lens{margin:0 auto;display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--border);background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);font-size:13.5px;color:var(--text-2)}
.lens i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--text-3))}
.tb{display:inline-grid;place-items:center;min-width:40px;height:40px;padding:0 10px;border-radius:999px;color:var(--text-2);font-size:13px;gap:8px;grid-auto-flow:column}
.tb:hover{color:var(--text-1)}
.tb svg{width:19px;height:19px}
.kbd{font-family:var(--f-mono);font-size:11px;padding:2px 6px;border-radius:6px;border:1px solid var(--border-strong);color:var(--text-3)}
.cmdk-wide{display:none;border:1px solid var(--border);background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:0 8px 0 14px;min-width:220px;justify-content:space-between;color:var(--text-3)}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--s-phys),var(--s-eng));color:#0B0C0E;font-weight:700;font-size:13px}
@media (min-width:1200px){.cmdk-wide{display:inline-grid}.tb.cmdk-small{display:none}}
@media (max-width:599px){.top{height:48px}.lens{font-size:12.5px;height:32px;padding:0 12px}.tb.theme{display:none}}
/* 초점 화면 */
.focus{position:relative;min-height:100svh;display:grid;align-content:end;padding:110px var(--gutter) 140px}
.knot{position:absolute;left:50%;top:24%;width:2px;height:2px;pointer-events:none}
.ftext{display:grid;gap:22px;max-width:640px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;color:var(--text-3)}
.fs{font-family:var(--f-d);font-weight:600;font-size:clamp(2.35rem,1.1rem + 4.4vw,5rem);line-height:1.12;letter-spacing:-.045em}
.fs .ln{display:block;overflow:hidden;padding-bottom:.08em;margin-bottom:-.08em}
.fs .ln>span{display:inline-block;transform:translateY(0);transition:transform .52s var(--ease-out),opacity .3s;transition-delay:calc(var(--i,0)*90ms)}
.fs .ln:nth-child(2){color:var(--text-2)}
.fs.out .ln>span{transform:translateY(-105%);opacity:0;transition:transform .18s var(--ease-in),opacity .18s;transition-delay:0ms}
.fs.pre .ln>span{transform:translateY(105%);transition:none}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;transition:opacity .42s .36s}
.btn{display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 24px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:16px;box-shadow:0 10px 30px -12px var(--accent);transition:transform .14s var(--ease-out),background-color .14s}
.btn:hover{background:var(--accent-hover)}.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px}
.quiet{min-height:44px;font-size:15px;color:var(--text-2);text-decoration:underline;text-decoration-color:var(--border-strong);text-underline-offset:6px}
.quiet:hover{color:var(--text-1)}
.peri{display:flex;flex-wrap:wrap;gap:6px 28px;margin-top:18px;transition:opacity .42s .36s}
.peri button{min-height:44px;display:inline-flex;align-items:center;gap:8px;font-size:14.5px;color:var(--text-3);transition:color .14s}
.peri button:hover,.peri button[aria-expanded="true"]{color:var(--text-1)}
.peri b{font-weight:500;color:var(--text-2)}
.peri i{width:7px;height:7px;border-radius:50%;background:var(--c,var(--text-3))}
.fade-out .acts,.fade-out .peri{opacity:0;transition-delay:0s;transition-duration:.18s}
.shelf{display:grid;grid-template-rows:0fr;transition:grid-template-rows .42s var(--ease-out)}
.shelf.open{grid-template-rows:1fr}
.shelf>div{overflow:hidden}
.shelf ul{display:grid;gap:2px;padding:10px 0 4px;max-width:440px}
.shelf li{display:grid;grid-template-columns:56px 1fr;gap:10px;font-size:14.5px;color:var(--text-2);padding:6px 0;border-top:1px solid var(--border)}
.shelf li:first-child{border-top:0}
.shelf time{font-family:var(--f-mono);font-size:12px;color:var(--text-3);padding-top:2px}
@media (min-width:900px) and (min-aspect-ratio:1/1){
 .focus{align-content:center;padding:96px var(--gutter) 120px}
 .knot{left:70%;top:44%}
 .ftext{max-width:min(46vw,620px)}
}
@media (min-width:1200px){.focus,.chap{padding-left:calc(var(--gutter) + 72px)}}
/* 장 */
.chap{min-height:80svh;display:grid;align-content:center;gap:28px;padding:80px var(--gutter)}
.chap h2{font-family:var(--f-d);font-weight:600;font-size:clamp(1.9rem,1.1rem + 2.6vw,3.4rem);line-height:1.15;letter-spacing:-.04em;max-width:16em}
.chap h2 span{color:var(--text-3)}
.chap .eyebrow{display:block}
.ribbon{width:100%;max-width:1000px;height:auto;overflow:visible}
.ribbon .base{fill:none;stroke:var(--text-3);stroke-width:1;opacity:.5}
.ribbon .cls{fill:none;stroke-width:9;stroke-linecap:round;opacity:.9}
.ribbon .dot{fill:var(--accent)}
.ribbon .now{stroke:var(--text-1);stroke-width:1.4}
.ribbon text{font-family:var(--f-mono);font-size:11px;fill:var(--text-3)}
.week{display:flex;flex-wrap:wrap;gap:clamp(10px,2vw,28px);align-items:flex-end}
.week figure{margin:0;display:grid;justify-items:center;gap:8px;font-family:var(--f-mono);font-size:11.5px;color:var(--text-3)}
.week svg path{fill:none;stroke-width:1.3}
.week figure.today figcaption{color:var(--text-1)}
.cont{display:grid;max-width:720px}
.cont li{display:flex;justify-content:space-between;gap:16px;align-items:baseline;padding:16px 0;border-top:1px solid var(--border);font-family:var(--f-d);font-size:clamp(1.15rem,1rem + .8vw,1.6rem);letter-spacing:-.03em}
.cont li small{font-family:var(--f-kr);font-size:13px;color:var(--text-3);letter-spacing:0;white-space:nowrap}
.cont li:last-child{border-bottom:1px solid var(--border)}
.rv{opacity:0;transform:translateY(24px);transition:opacity .7s var(--ease-out),transform .7s var(--ease-out)}
.rv.in{opacity:1;transform:none}
/* 독 */
.dock{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));z-index:45;display:flex;align-items:center;gap:2px;padding:6px;border-radius:999px;background:var(--glass);border:1px solid var(--border);-webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%);box-shadow:var(--shadow-3);transform:translateX(-50%);transition:transform .42s var(--spring)}
.dock.hide{transform:translate(-50%,140%);transition:transform .24s var(--ease-in)}
.dock a{position:relative;display:grid;place-items:center;width:48px;height:48px;border-radius:999px;color:var(--text-3);transition:color .14s,background-color .2s}
.dock a:hover{color:var(--text-1)}
.dock a[aria-current="page"]{color:var(--text-1);background:var(--surface)}
.dock a[aria-current="page"]::after{content:"";position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;background:var(--accent)}
.dock svg{width:22px;height:22px}
.dock .sep{width:1px;height:24px;background:var(--border-strong);margin:0 4px}
.dock .lbl{display:none}
@media (max-width:599px){.dock a.g{display:none}.dock a{width:46px;height:46px}}
@media (min-width:1200px){
 .dock{left:16px;top:50%;bottom:auto;flex-direction:column;border-radius:28px;transform:translateY(-50%)}
 .dock.hide{transform:translate(-140%,-50%)}
 .dock .sep{width:24px;height:1px;margin:4px 0}
 .dock a{width:44px;height:44px}
 .dock a:hover .lbl{display:block;position:absolute;left:54px;padding:6px 10px;border-radius:8px;background:var(--surface);border:1px solid var(--border);font-size:12.5px;color:var(--text-1);white-space:nowrap}
}
/* 시연 컨트롤 · 토스트 */
.proto{position:fixed;right:var(--gutter);top:64px;z-index:41;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-3)}
.proto select{height:32px;padding:0 10px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:12.5px;color:var(--text-2)}
@media (max-width:599px){.proto{top:auto;bottom:86px;right:16px}}
.toast{position:fixed;left:50%;top:70px;z-index:60;padding:10px 16px;border-radius:999px;background:var(--text-1);color:var(--bg-0);font-size:13.5px;font-weight:500;transform:translate(-50%,-10px);opacity:0;transition:opacity .24s,transform .3s var(--ease-out);pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
