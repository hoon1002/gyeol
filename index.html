<!doctype html>
<html lang="ko" data-theme="dark" data-motion="rich">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070A14" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="결(GYEOL) — 쓰고, 잇고, 남긴다. 필기·연결·복습·집중이 한 결로 이어지는 학습 앱." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="결" />
    <title>결 — 쓰고, 잇고, 남긴다</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,200..600;1,9..144,200..600&family=Hahmlet:wght@300..800&family=JetBrains+Mono:wght@300..600&family=Noto+Sans+KR:wght@300..700&display=swap"
    />
    <script>
      /* 초기 테마 깜빡임 방지: 설정 스토어(gyeol-settings)의 테마·모션을 칠하기 전에 적용 */
      (function () {
        var d = document.documentElement, t = 'dark', m = 'rich';
        try {
          var raw = localStorage.getItem('gyeol-settings');
          if (raw) {
            var s = (JSON.parse(raw) || {}).state || {};
            if (s.theme === 'light' || s.theme === 'dark' || s.theme === 'system') t = s.theme;
            if (s.motion === 'calm' || s.motion === 'off' || s.motion === 'rich') m = s.motion;
          }
        } catch (e) {}
        try {
          if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          if (location.pathname === '/focus') t = 'dark';
          if (matchMedia('(prefers-reduced-motion: reduce)').matches) m = 'off';
        } catch (e) {}
        d.setAttribute('data-theme', t);
        d.setAttribute('data-motion', m);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', t === 'light' ? '#F3F1EC' : '#070A14');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript><p style="padding:24px;font-family:system-ui">결은 자바스크립트가 필요해요.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
